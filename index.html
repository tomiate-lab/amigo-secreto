<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15132b">
  <meta name="description" content="Uma surpresa do amigo secreto! 🎁">
  <title>Surpresa! 🎁</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 20px; display: grid; place-items: center; background: radial-gradient(circle at 50% 12%, #472677 0%, #24183f 45%, #15132b 100%); }
    .modal { width: min(100%, 390px); padding: 43px 22px; border-radius: 26px; background: #fff; color: #6938a0; text-align: center; box-shadow: 0 30px 95px rgba(0,0,0,.45); animation: show .5s cubic-bezier(.2,1.35,.3,1) both; }
    .emoji { font-size: 78px; line-height: 1.15; margin-bottom: 17px; }
    h1 { font-size: clamp(28px,8vw,39px); line-height: 1.13; margin: 0; font-weight: 800; }
    @keyframes show { from { opacity: 0; transform: scale(.84) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
  </style>
</head>
<body>
  <main class="modal">
    <div class="emoji" aria-hidden="true">🤣🎉</div>
    <h1>Cê é curioso, hein!!</h1>
  </main>
</body>
</html>
